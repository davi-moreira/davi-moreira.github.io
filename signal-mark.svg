<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
<style>
.bg{fill:#000000}
.ring{fill:none;stroke:#C4BFC0;stroke-opacity:.35;stroke-width:2px;vector-effect:non-scaling-stroke}
.arcs{fill:none;stroke:#CFB991;stroke-width:3.5px;stroke-linecap:round;transform-origin:20px 20px;opacity:.45;transform:scale(.45)}
.arcs path{vector-effect:non-scaling-stroke}
.late{opacity:.7;transform:scale(.72)}
.later{opacity:1;transform:scale(1)}
.core{fill:#CFB991;transform-origin:20px 20px}
/* The still mark above is the default, so it also shows wherever animation is off or unsupported. */
@media (prefers-reduced-motion:no-preference){
.arcs{opacity:0;animation:broadcast 2.7s ease-out infinite}
.late{animation-delay:.9s}
.later{animation-delay:1.8s}
.core{animation:emit .9s ease-out infinite}
}
@keyframes broadcast{0%{transform:scale(.18);opacity:1}80%{opacity:.5}100%{transform:scale(1);opacity:0}}
@keyframes emit{0%{transform:scale(1.45)}40%,100%{transform:scale(1)}}
</style>
<circle class="bg" cx="20" cy="20" r="20"/>
<circle class="ring" cx="20" cy="20" r="15.5"/>
<g class="arcs"><path d="M31.87 10.04A15.5 15.5 0 0 1 31.87 29.96"/><path d="M8.13 10.04A15.5 15.5 0 0 0 8.13 29.96"/></g>
<g class="arcs late"><path d="M31.87 10.04A15.5 15.5 0 0 1 31.87 29.96"/><path d="M8.13 10.04A15.5 15.5 0 0 0 8.13 29.96"/></g>
<g class="arcs later"><path d="M31.87 10.04A15.5 15.5 0 0 1 31.87 29.96"/><path d="M8.13 10.04A15.5 15.5 0 0 0 8.13 29.96"/></g>
<circle class="core" cx="20" cy="20" r="3"/>
</svg>
